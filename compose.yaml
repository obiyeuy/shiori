name: personal-site
services:
  db:
    container_name: personal-site-db
    image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_DB: ${APP_DATABASE_NAME:-personal_site}
      POSTGRES_USER: ${POSTGRES_USER:-personal_site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    container_name: personal-site-web
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    image: personal-site:latest
    profiles: [web]
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_site}:${POSTGRES_PASSWORD}@db:5432/${APP_DATABASE_NAME:-personal_site}
      SESSION_SECRET: ${SESSION_SECRET:?Set session secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-personal_site_session}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:5173}
      ORIGIN: ${PUBLIC_SITE_URL:-http://127.0.0.1:5173}
      NODE_ENV: production
      MEDIA_ROOT: /data/media
      BODY_SIZE_LIMIT: 110M
    volumes: ["${MEDIA_ROOT_PATH:-./.local/media}:/data/media"]
    ports: ["127.0.0.1:${SITE_PORT:-5173}:3000"]
    depends_on:
      db: {condition: service_healthy}
  schedule-worker:
    container_name: personal-site-scheduler
    image: personal-site:latest
    profiles: [pipeline]
    build: .
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/schedule-worker.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-personal_site}:${POSTGRES_PASSWORD}@db:5432/${APP_DATABASE_NAME:-personal_site}
      SESSION_SECRET: ${SESSION_SECRET:?Set session secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-personal_site_session}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:5173}
      NODE_ENV: production
      MEDIA_ROOT: /data/media
    volumes: ["${MEDIA_ROOT_PATH:-./.local/media}:/data/media"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  db-data:
    name: ${DB_VOLUME_NAME:-personal-site-db}
    external: ${DB_VOLUME_EXTERNAL:-false}
