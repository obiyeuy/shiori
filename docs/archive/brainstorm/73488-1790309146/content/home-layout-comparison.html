<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人综合站 · 首页线框比较</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1edf5;color:#292337;font:16px/1.65 system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:28px}h1{font-size:28px;margin:4px 0}p{margin:8px 0;color:#665d73}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#7650ad}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.option{background:#fff;border:2px solid #ded5e8;border-radius:18px;overflow:hidden}.option.selected{border-color:#6d4aff;box-shadow:0 0 0 3px #6d4aff22}.intro{padding:20px;min-height:184px}.intro h2{font-size:21px;margin:0}.intro p{font-size:14px}.select{font:inherit;border:1px solid #6d4aff;border-radius:10px;background:#fff;color:#5834d0;padding:9px 18px;min-height:44px;cursor:pointer}.select:focus-visible{outline:3px solid #f3b845;outline-offset:3px}.selected .select{background:#6d4aff;color:white}.wire{background:#fffaf6;margin:0 14px 14px;border:1px solid #ded5e8;border-radius:10px;padding:14px;font-size:12px;min-height:740px}.nav{border-bottom:1px solid #ded5e8;padding-bottom:10px;line-height:2}.brand{font-weight:800;margin-right:12px}.links{word-spacing:5px}.actions{color:#746783;font-size:11px}.welcome{display:flex;align-items:center;justify-content:space-between;padding:22px 8px;gap:10px}.welcome h3{font-size:18px;margin:0}.welcome p{font-size:11px}.avatar{flex:0 0 62px;height:62px;border:1px dashed #aa98c0;border-radius:50%;display:grid;place-items:center;background:#eee6f5;color:#75658a;text-align:center;font-size:10px}.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:750;font-size:14px}.more{font-size:10px;font-weight:400;color:#7a6c88}.row{padding:10px 0;border-bottom:1px solid #eae1ea}.tag{font-size:9px;display:inline-block;border-radius:4px;padding:1px 5px;background:#eae2fa;color:#513d71;margin-right:5px}.pink{background:#fae1eb;color:#724557}.blue{background:#dfeef9;color:#365c78}.date{font-size:9px;color:#817387}.title{font-weight:650;line-height:1.5;margin:5px 0}.summary{font-size:10px;color:#817387}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:white;border:1px solid #e4dce9;border-radius:9px;padding:12px}.cover{height:52px;border-radius:6px;background:#ece6f3;margin-bottom:8px;display:grid;place-items:center;color:#817387;font-size:10px}.footer{margin-top:24px;border-top:1px solid #ded5e8;padding:16px 0 5px;color:#817387;font-size:10px}.twocol{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.twocol .grid{grid-template-columns:1fr}.twocol .title{font-size:11px}.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bento .section{margin:0}.span2{grid-column:span 2}.bento .section-title{font-size:12px}.note{padding:20px 24px;background:#fff;border-radius:14px;margin-top:22px;font-size:14px}.note strong{color:#5535a0} @media(max-width:1050px){.options{grid-template-columns:1fr}.intro{min-height:0}.wire{max-width:650px;margin:0 auto 20px;min-height:0}.option{padding-bottom:4px}header,main{padding:18px}} 
</style></head><body><header><div class="eyebrow">DESIGN DISCUSSION / 01</div><h1>首页怎么展开，内容最好找？</h1><p>先选信息布局。配色、插画、站名和示例内容都不是最终设计；这里展示的是桌面结构缩略图。</p></header><main><div class="options" id="options"></div><div class="note"><strong>本轮只确认布局骨架。</strong> 三种方案均采用顶部导航，个人介绍保持简短。具体条目数、更新排序、精选规则、空栏目处理、导航收纳方式尚未确认。角色区域只作占位，不代表已选择固定吉祥物。示例工具与作品不构成首版功能承诺。<p>可点击选择，再回到对话告诉我理由或想混合的部分。移动端会在后续单独画图。</p></div></main>
<script>
const nav='<div class="nav"><span class="brand">站点标识</span><span class="links">首页 文章 笔记 动态 作品 工具 资源 关于</span><div class="actions">搜索 · 主题切换 · 个人空间入口</div></div>';
const welcome='<div class="welcome"><div><h3>把好奇心，写成记录。</h3><p>记录技术、日常，以及一些小作品。</p><span class="more">关于我 →</span></div><div class="avatar">头像／角色<br>占位</div></div>';
const head=(s)=>'<div class="section-title">'+s+'<span class="more">查看全部 →</span></div>';
const updates='<div class="row"><span class="tag">文章</span><span class="date">09.24</span><div class="title">从一次实践理解数据库索引</div><div class="summary">数据库 · 学习记录</div></div><div class="row"><span class="tag blue">笔记</span><span class="date">09.23</span><div class="title">SvelteKit 的页面数据如何加载</div><div class="summary">SvelteKit · Web</div></div><div class="row"><span class="tag pink">动态</span><span class="date">09.22</span><div class="title">这周，给小站画了第一张草图。</div></div><div class="row"><span class="tag blue">笔记</span><span class="date">09.21</span><div class="title">几个常用的终端小技巧</div></div>';
const feature='<div class="tile"><span class="tag">精选文章</span><div class="title">把知识整理成可持续的系统</div><div class="summary">从收集到输出，建立自己的节奏。</div></div><div class="tile"><span class="tag blue">精选笔记</span><div class="title">我的 Linux 排查清单</div><div class="summary">常见问题与实践记录。</div></div>';
const works='<div class="tile"><div class="cover">项目封面占位</div><div class="title">个人综合站</div><div class="summary">设计与构建过程</div></div><div class="tile"><div class="cover">项目封面占位</div><div class="title">一个周末实验</div><div class="summary">创作与尝试</div></div>';
const tools='<div class="tile"><div class="title">公开工具示例</div><div class="summary">一句话解释用途 · 打开 →</div></div><div class="tile"><div class="title">公开工具示例</div><div class="summary">仅示意，不承诺开发</div></div>';
const section=(name,content)=>'<section class="section">'+head(name)+content+'</section>';
const footer='<div class="footer">RSS · GitHub · 关于 · 个人空间<br>站点说明与版权信息</div>';
const layouts=[{id:'flow',title:'01 顺序分区 · 推荐',desc:'欢迎 → 最近更新 → 精选 → 作品 → 工具。浏览顺序明确，内容少时也自然；作品和工具需要继续向下滚动。',body:section('最近更新',updates)+section('精选文章 / 笔记','<div class="grid">'+feature+'</div>')+section('作品','<div class="grid">'+works+'</div>')+section('工具','<div class="grid">'+tools+'</div>')},{id:'parallel',title:'02 更新与精选并排',desc:'最近更新放左侧，精选常驻右侧，下方依次是作品和工具。首屏更紧凑；两个阅读入口会同时争夺注意力。',body:'<div class="twocol">'+section('最近更新',updates)+section('值得一读','<div class="grid">'+feature+'</div>')+'</div>'+section('作品','<div class="grid">'+works+'</div>')+section('工具','<div class="grid">'+tools+'</div>')},{id:'mosaic',title:'03 非对称卡片拼接',desc:'更新占左侧主卡，精选占右侧，作品与工具组成下层卡片。更像创作者展板；长标题和内容增减更考验排版。',body:'<div class="bento"><div class="tile">'+head('最近更新')+updates+'</div><div>'+head('精选')+feature+'</div><div class="tile span2">'+head('作品')+'<div class="grid">'+works+'</div></div><div class="tile span2">'+head('工具')+'<div class="grid">'+tools+'</div></div></div>'}];
document.getElementById('options').innerHTML=layouts.map(x=>'<article class="option" data-choice="'+x.id+'"><div class="intro"><h2>'+x.title+'</h2><p>'+x.desc+'</p><button class="select" type="button" aria-pressed="false" onclick="choose(this)">选择此结构</button></div><div class="wire">'+nav+welcome+x.body+footer+'</div></article>').join('');
function choose(button){const card=button.closest('.option');if(typeof toggleSelect==='function')toggleSelect(card);else{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));card.classList.add('selected')}document.querySelectorAll('.select').forEach(x=>x.setAttribute('aria-pressed',String(x.closest('.option').classList.contains('selected'))));}
</script></body></html>
